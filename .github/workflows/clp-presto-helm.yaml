name: "clp-presto-helm"

on:
  pull_request:
    paths: &monitored_paths
      - ".github/workflows/clp-presto-helm.yaml"
      - "taskfile.yaml"
      - "taskfiles/**"
      - "tools/deployment/clp-presto-helm/**"
      - "tools/yscope-dev-utils"
  push:
    # TODO: reduce to ["main"] once the GHCR publish path has been exercised once.
    branches: ["main", "feat/clp-presto-helm-chart"]
    paths: *monitored_paths

  # A manual run publishes one channel, chosen here. It defaults to `snapshot` so that testing the
  # publish path cannot move a release tag that a consumer may already have pinned.
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to publish"
        type: "choice"
        options: ["snapshot", "release"]
        default: "snapshot"

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"

  # Cancel in-progress jobs for efficiency. Exclude the `main` branch to allow uninterrupted
  # publishing of Helm charts.
  cancel-in-progress: "${{github.ref != 'refs/heads/main'}}"

jobs:
  lint:
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64 || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          submodules: "recursive"

          # Fetch all history for all branches; otherwise, `ct lint` would complain about not
          # finding the `origin/main` branch.
          fetch-depth: 0

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"
        with:
          version: "3.10"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      - name: "Lint Helm charts"
        shell: "bash"
        run: "task lint:check-helm"

  # Exercises the publish path against a throwaway registry. Without this, the path would first run
  # in production, on `main`, where the republish guard can only be observed by misfiring.
  test-publish:
    if: "github.event_name == 'pull_request'"
    needs: "lint"
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64 || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    services:
      registry:
        image: "registry:2"
        ports: ["5000:5000"]
    env:
      OCI_REPO: "oci://localhost:5000/charts"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      - name: "Package Helm chart"
        shell: "bash"
        run: "task helm:package"

      - name: "Publish Helm chart"
        shell: "bash"
        run: "task helm:publish OCI_REPO=\"$OCI_REPO\" REGISTRY_FLAGS=--plain-http"

      # Renders the chart pulled back out of the registry, which is the path a consumer takes. The
      # values come from the repository because `ci/` is excluded from the packaged tarball.
      - name: "Render the published chart the way a consumer would"
        shell: "bash"
        run: |-
          . "build/toolchains/helm/env"
          version="$(basename "$(ls build/clp-presto-helm/*.tgz)" .tgz)"
          version="${version#clp-presto-}"
          for values in tools/deployment/clp-presto-helm/ci/*.yaml ; do
            helm template "${OCI_REPO}/clp-presto" \
              --version "${version}" \
              --plain-http \
              --values "${values}" > /dev/null
          done

      - name: "Republishing the same version pushes nothing"
        shell: "bash"
        run: |-
          output="$(task helm:publish OCI_REPO="$OCI_REPO" REGISTRY_FLAGS=--plain-http 2>&1)"
          echo "${output}"
          if [[ "${output}" != *"already published"* ]] ; then
            echo "Expected the guard to skip the push, but the chart was pushed again."
            exit 1
          fi

      # The nightly publishes only this channel, so it is the half that would otherwise first run
      # unattended. Its version is fixed, so a second publish must replace the first.
      - name: "Publish and replace a snapshot version"
        shell: "bash"
        run: |-
          version="0.0.0-SNAPSHOT"
          task helm:package VERSION="${version}"
          for attempt in first second ; do
            output="$(task helm:publish OCI_REPO="$OCI_REPO" REGISTRY_FLAGS=--plain-http \
                        OVERWRITE=true 2>&1)"
            echo "${output}"
            if [[ "${output}" != *"Pushed:"* ]] ; then
              echo "The ${attempt} snapshot push did not happen; OVERWRITE must bypass the guard."
              exit 1
            fi
          done

  publish:
    # A snapshot may be published from any branch: it is a moving tag that the next publish
    # replaces, so an unreviewed branch can only move a tag that is already disposable. A release
    # is published only when a run asks for it, so a branch must be dispatched with that channel
    # deliberately rather than tagging itself by being pushed.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    needs: "lint"
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64 || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      # To push the chart to the GitHub Container Registry. Other registries authenticate with
      # `secrets.CLP_PRESTO_CHART_REGISTRY_PASSWORD` instead.
      packages: "write"
    env:
      # Overridable by a repository variable, for publishing to a registry other than GHCR.
      OCI_REPO: "${{vars.CLP_PRESTO_CHART_OCI_REPO || 'oci://ghcr.io/y-scope/charts'}}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      # The workflow token is valid only for GHCR, so the destination decides which credential the
      # steps below use.
      - name: "Resolve the registry"
        id: "registry"
        shell: "bash"
        run: |-
          registry="${OCI_REPO#oci://}"
          registry="${registry%%/*}"
          echo "OCI_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          if [[ "${registry}" == "ghcr.io" ]] ; then
            echo "uses_github_token=true" >> "${GITHUB_OUTPUT}"
          else
            echo "uses_github_token=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: "Log in to the GitHub Container Registry"
        if: "steps.registry.outputs.uses_github_token == 'true'"
        shell: "bash"
        env:
          HELM_REGISTRY_PASSWORD: "${{secrets.GITHUB_TOKEN}}"
        run: "task helm:registry-login REGISTRY=ghcr.io USERNAME=\"$GITHUB_ACTOR\""

      # Never given the workflow token: it is valid only for GHCR, and sending it elsewhere would
      # leak it to a third party.
      - name: "Log in to the configured registry"
        if: "steps.registry.outputs.uses_github_token != 'true'"
        shell: "bash"
        env:
          HELM_REGISTRY_PASSWORD: "${{secrets.CLP_PRESTO_CHART_REGISTRY_PASSWORD}}"
          HELM_REGISTRY_USERNAME: "${{vars.CLP_PRESTO_CHART_REGISTRY_USERNAME}}"
        run: |-
          : "${HELM_REGISTRY_USERNAME:?set CLP_PRESTO_CHART_REGISTRY_USERNAME}"
          task helm:registry-login REGISTRY="$OCI_REGISTRY" USERNAME="$HELM_REGISTRY_USERNAME"

      # The release channel takes its version from `Chart.yaml`, so this is a no-op on every run
      # that does not bump it.
      # Manual only: a release tag is what a consumer pins, so it is never published as a side
      # effect of a push, and the run has to name the channel. The snapshot below is disposable and
      # is published on every push.
      - name: "Package and publish the release chart"
        if: "github.event_name == 'workflow_dispatch' && inputs.channel == 'release'"
        shell: "bash"
        run: |-
          task helm:package PIN_IMAGES=true
          task helm:publish OCI_REPO="$OCI_REPO"

      # One snapshot tag, replaced on every publish. A prerelease identifier rather than build
      # metadata, because OCI tags disallow `+` and a dependency pinned to a release can never
      # resolve to a prerelease.
      - name: "Package and publish the snapshot chart"
        if: "github.event_name == 'push' || inputs.channel == 'snapshot'"
        shell: "bash"
        run: |-
          # Package once without a version override to learn what `Chart.yaml` declares. The
          # release step above supplies this on a push, but a snapshot-only run skips it.
          task helm:package
          chart_version="$(basename "$(ls build/clp-presto-helm/*.tgz)" .tgz)"
          chart_version="${chart_version#clp-presto-}"

          version="${chart_version}-SNAPSHOT"
          task helm:package VERSION="${version}" PIN_IMAGES=true
          task helm:publish OCI_REPO="$OCI_REPO" OVERWRITE=true

  # The chart pairs a moving connector tag with fixed Presto images, and the two are ABI-coupled: a
  # snapshot that breaks the pairing still installs and pulls cleanly, then crashes the worker on
  # the first query. This runs the connector's integration suite against the reference the chart
  # defaults to, so that a broken snapshot is caught here rather than by a deployment.
  #
  # Manual: the suite pulls several GiB of images and takes minutes, which is too much to add to
  # every snapshot publish.
  smoke-test:
    if: "github.event_name == 'workflow_dispatch'"
    needs: "lint"
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_HEAVY_X64 || '["ubuntu-24.04"]') }}
    timeout-minutes: 60
    permissions:
      # To check out the repository.
      contents: "read"
      # To pull the connector image.
      packages: "read"
    env:
      # Two runs on one machine would otherwise share container names and compete for the port.
      COMPOSE_PROJECT_NAME: "clp-helm-smoke-${{github.run_id}}-${{github.run_attempt}}"
      CLP_INTEGRATION_TEST_COORDINATOR_PORT: "0"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

          # Renders the chart below, which needs the taskfiles the submodule carries.
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      # Read out of the chart rather than repeated here: this job exists to check the pairing the
      # chart ships, so a copy of the default image would let the two drift apart silently.
      - name: "Resolve the connector image the chart defaults to"
        shell: "bash"
        run: |-
          task helm:toolchains:helm
          . "build/toolchains/helm/env"
          image="$(helm template clp-presto tools/deployment/clp-presto-helm \
                     --values tools/deployment/clp-presto-helm/ci/default-values.yaml \
                     --show-only templates/worker-deployment.yaml |
                   awk '/name: "install-clp-plugin"/ { found = 1 }
                        found && /^[[:space:]]*image:/ { print $2; exit }' |
                   tr -d '"')"
          if [[ -z "${image}" ]] ; then
            echo "Could not read the connector image out of the chart." >&2
            exit 1
          fi
          echo "Using the chart's connector image: ${image}"
          echo "CLP_PLUGIN_INSTALLER_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: "Start the cluster"
        shell: "bash"
        working-directory: "integration-tests"
        run: "docker compose up --detach"

      - name: "Run the integration tests"
        shell: "bash"
        working-directory: "integration-tests"
        run: "docker compose run --rm tests"

      - name: "Capture cluster logs on failure"
        if: "failure()"
        shell: "bash"
        working-directory: "integration-tests"
        run: "docker compose logs --tail 200 || true"

      - name: "Stop the cluster"
        if: "always()"
        shell: "bash"
        working-directory: "integration-tests"
        run: "docker compose down --volumes --remove-orphans"
