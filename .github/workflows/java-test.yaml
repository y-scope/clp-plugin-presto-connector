# Runs presto-connector's Java test suite (equivalent to `task presto-connector:test`).
#
# The tests compile against the pinned Presto commit's unpublished artifacts, so this first
# source-builds them via install-presto-artifacts.sh with the `test`-scope closure. Note that
# `build-packages.yaml` deliberately packages with `-Dmaven.test.skip=true`, so this workflow is
# the only place the tests run.
#
# Deliberately unfiltered by path: this check is intended to be a required status check, and a
# path-filtered workflow that skips leaves the check permanently "expected" rather than passing.

name: "java-test"

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Ensure the pinned Presto commit's Maven artifacts exist"
        run: "./tools/presto-deps/install-presto-artifacts.sh --with-test-deps"

      - name: "Run the Java tests"
        working-directory: "presto-connector"
        run: "./mvnw --batch-mode test"
