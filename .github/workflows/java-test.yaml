# Runs presto-connector's Java tests. Invokes `task presto-connector:test` rather than
# open-coding its steps, so that CI and local runs can't drift.
#
# Deliberately unfiltered by path: this is intended to be a required status check, and a
# path-filtered workflow that skips leaves the check permanently "expected" rather than passing.

name: "java-test"

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      - name: "Run the Java tests"
        run: "task presto-connector:test"
