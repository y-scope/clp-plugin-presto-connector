# Validates that this repository's dependency pins stay in sync with the Presto commit it
# is built against (G_PRESTO_GIT_TAG in taskfile.yaml).
#
# tools/presto-deps/validate-presto-dep-sync.py prints an OK or FAIL line per pin. Each
# FAIL names the out-of-sync pin, the version this repository uses, the version the
# pinned Presto commit ships, and the value to change it to, e.g.:
#   FAIL jackson.version: pom.xml pins 2.15.4 but presto@6e1942b72 ships 2.18.6
#        Suggestion: set <jackson.version> to 2.18.6 in presto-connector/pom.xml.
# The check only reports; fixing the pins is a manual edit.

name: "validate-deps"

on:
  pull_request:
    paths:
      - ".github/workflows/validate-deps.yaml"
      - "presto-connector/pom.xml"
      - "taskfile.yaml"
      - "taskfiles/velox-connector/deps.yaml"
      - "tools/presto-deps/validate-presto-dep-sync.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-deps.yaml"
      - "presto-connector/pom.xml"
      - "taskfile.yaml"
      - "taskfiles/velox-connector/deps.yaml"
      - "tools/presto-deps/validate-presto-dep-sync.py"
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  validate:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - name: "Validate dependency pins against the pinned Presto commit"
        run: "./tools/presto-deps/validate-presto-dep-sync.py"
