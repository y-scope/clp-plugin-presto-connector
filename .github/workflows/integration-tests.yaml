# Runs the connector's integration tests against a real Presto cluster.

name: "integration-tests"

on:
  pull_request:
    paths:
      - ".github/workflows/integration-tests.yaml"
      - "integration-tests/**"
      - "presto-connector/**"
      - "taskfile.yaml"
      - "taskfiles/**"
      - "tools/**"
      - "velox-connector/**"
      - "!**/*.md"
  push:
    branches: ["main"]
  schedule:
    # Daily at 00:15 UTC. This suite is the one whose result can change without the code changing,
    # because it drives a real cluster; re-running it unchanged is how flakiness becomes visible.
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions: {}

jobs:
  integration-tests:
    runs-on: "ubuntu-24.04"
    # Packaging the connector dominates the runtime.
    timeout-minutes: 120
    permissions:
      # To check out the repository.
      contents: "read"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"
        with:
          version: "3.48.0"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-uv"
        with:
          version: "0.11.3"

      # `--keep-cluster` leaves the containers up for the log-capture step below. The runner is
      # ephemeral, so nothing needs to clean them up.
      - name: "Run the integration tests"
        run: "task integration-tests:run -- --keep-cluster"

      - name: "Capture cluster logs on failure"
        if: "failure()"
        working-directory: "integration-tests"
        run: "docker compose logs --tail 200 || true"
