# Builds CLP Presto connector packages for amd64 and arm64.
#
# Flow:
#   resolve-version         use the input version or derive it from pom.xml
#   build-dependency-image  ensure the hash-tagged build-env image exists
#   build                   build .deb / .rpm / .tar.gz artifacts per architecture
#   image                   build the busybox installer image per arch (push on main/tags)
#   manifest                combine per-arch images into a multi-arch tag (main/tags only)
#
# See tools/build-packages/README.md for package-build details.

name: "build-packages"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version override (derived from presto-connector/pom.xml when blank)"
        required: false
        default: ""
      amd64_cpu_target:
        description: "amd64 CPU_TARGET (Velox get_cxx_flags): avx, sse, or blank for the
          official presto-native default (avx)"
        required: false
        default: ""
      arm64_cpu_target:
        description: "arm64 CPU_TARGET (Velox get_cxx_flags): aarch64, or blank
          (equivalent; arm has a single flag family)"
        required: false
        default: ""
      arm64_build_target:
        description: "arm64 ARM_BUILD_TARGET: 'local' tunes for the runner's detected
          Neoverse core; use only when the deployment hardware matches the runner
          (blank = 'common', the portable armv8-a baseline)"
        required: false
        default: ""
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/build-packages.yaml"
      - ".github/workflows/build-dependency-image.yaml"
      - "presto-connector/**"
      - "taskfile.yaml"
      - "taskfiles/**"
      - "tools/build-packages/**"
      - "tools/yscope-dev-utils"
      - "velox-connector/**"
      # Markdown files don't change the artifact, so skip rebuilds on documentation-only changes.
      - "!**/*.md"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

env:
  CI_CONTAINER_REGISTRY: "${{vars.CI_CONTAINER_REGISTRY}}"
  CI_CONTAINER_REGISTRY_REPO: "${{vars.CI_CONTAINER_REGISTRY_REPO}}"

jobs:
  resolve-version:
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64 || '["ubuntu-24.04"]') }}
    outputs:
      version: "${{steps.version.outputs.version}}"
      publish: "${{steps.publish.outputs.publish}}"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      # `mvnw` fetches Maven itself but still needs a JDK, which a self-hosted runner does not
      # necessarily carry and the GitHub-hosted image happens to provide.
      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Resolve package version"
        id: "version"
        env:
          INPUT_VERSION: "${{inputs.version || ''}}"
        run: |-
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            if ! version=$(
              ./presto-connector/mvnw --quiet --file presto-connector/pom.xml \
                help:evaluate \
                -Dexpression=project.version \
                -DforceStdout
            ); then
              echo "::error::Failed to derive project.version with Maven"
              exit 1
            fi
            if [[ -z "${version}" ]]; then
              echo "::error::Maven returned an empty project.version"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Package version: ${version}"

      - name: "Decide whether to publish images"
        id: "publish"
        env:
          DEFAULT_BRANCH: "${{github.event.repository.default_branch}}"
        run: |-
          # Publish images only from the default branch and version tags so feature
          # branches don't overwrite shared tags.
          if [[ ${GITHUB_REF_NAME} == "${DEFAULT_BRANCH}" || ${GITHUB_REF_TYPE} == tag ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-dependency-image:
    uses: "./.github/workflows/build-dependency-image.yaml"
    permissions:
      contents: "read"
      packages: "write"
    # Without this the callee sees empty registry credentials and falls back to the GitHub token.
    secrets: "inherit"

  # Packages and the installer image are built in one job, the same way a local build does, so the
  # tarball never has to travel between jobs. Splitting them would need an artifact to carry it.
  build:
    needs: ["build-dependency-image", "resolve-version"]
    permissions:
      contents: "read"
      # To pull the build-env image and push the installer image.
      packages: "write"
    strategy:
      # Build both architectures so one failure does not hide the other result.
      fail-fast: false
      matrix:
        include:
          - arch: "amd64"
            runner: >-
              ${{ vars.GH_RUNNER_LINUX_HEAVY_X64 || '["ubuntu-24.04"]' }}
          - arch: "arm64"
            runner: >-
              ${{ vars.GH_RUNNER_LINUX_HEAVY_ARM64 || '["ubuntu-24.04-arm"]' }}
    runs-on: >-
      ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    env:
      ARCH: "${{matrix.arch}}"
      VERSION: "${{needs.resolve-version.outputs.version}}"
    # Matrix legs share one output namespace, so each leg fills only its own arch's key
    # (the other resolves to empty and is ignored by the merge below).
    outputs:
      digest_amd64: "${{steps.image.outputs.digest_amd64}}"
      digest_arm64: "${{steps.image.outputs.digest_arm64}}"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false
          # Required because taskfiles include shared utilities from the submodule.
          submodules: true

      # Covers both pulling the build-env image below and pushing the installer image.
      - name: "Log in to the container registry"
        uses: "docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0"  # v4.4.0
        with:
          registry: "${{vars.CI_CONTAINER_REGISTRY || 'ghcr.io'}}"
          username: "${{secrets.CI_CONTAINER_REGISTRY_USERNAME || github.actor}}"
          password: "${{secrets.CI_CONTAINER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN}}"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c"  # v4.2.0

      - name: "Build packages"
        id: "packages"
        shell: "bash"
        env:
          AMD64_CPU_TARGET: "${{inputs.amd64_cpu_target || ''}}"
          ARM64_CPU_TARGET: "${{inputs.arm64_cpu_target || ''}}"
          ARM64_BUILD_TARGET: "${{inputs.arm64_build_target || ''}}"
        run: |-
          # Apply this architecture's inputs (blank uses the official presto-native
          # defaults); see "Target-CPU flags" in tools/build-packages/README.md.
          if [[ "${ARCH}" == "amd64" ]]; then
            export CPU_TARGET="${AMD64_CPU_TARGET}"
          else
            export CPU_TARGET="${ARM64_CPU_TARGET}"
            export ARM_BUILD_TARGET="${ARM64_BUILD_TARGET}"
          fi

          # Resolves and pulls the build-env image, runs the build inside it, and loads the
          # installer image locally, which validates that it builds even when not publishing.
          bash tools/build-packages/build-packages.sh --version "${VERSION}"

          shopt -s nullglob
          for extension in deb rpm tar.gz; do
            artifact_files=(packages/clp-plugin-presto-connector*."${extension}")
            if (( ${#artifact_files[@]} != 1 )); then
              echo "::error::Expected exactly one .${extension} artifact," \
                "found ${#artifact_files[@]}"
              exit 1
            fi
            printf '%s_filename=%s\n' \
              "${extension//./_}" "${artifact_files[0]##*/}" >> "$GITHUB_OUTPUT"
          done

      # Rebuilding to push costs only a tarball copy on top of buildx's cache. Capture the digest
      # so the manifest job combines the exact images this run built (per-arch tags are mutable and
      # a concurrent run could move them in between).
      - name: "Push the installer image"
        id: "image"
        if: "${{needs.resolve-version.outputs.publish == 'true'}}"
        run: |-
          source tools/build-packages/dependency-image/utils.sh
          image_repo="$(resolve_image_repo)"
          shopt -s nullglob
          tarballs=(packages/*-linux-"${ARCH}".tar.gz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::Expected exactly one tarball for ${ARCH}, found ${#tarballs[@]}"
            exit 1
          fi
          bash tools/build-packages/build-installer-init-image.sh \
            --tarball "${tarballs[0]}" \
            --arch "${ARCH}" \
            --repo "${image_repo}" \
            --push \
            --digest-file digest.txt
          echo "digest_${ARCH}=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      # Deliverables only; nothing downstream reads them, so a deployment without artifact storage
      # can turn them off.
      - name: "Upload deb package"
        if: "vars.CI_UPLOAD_PACKAGE_ARTIFACTS != 'false'"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f"  # v6.0.0
        with:
          name: "${{steps.packages.outputs.deb_filename}}"
          path: "packages/${{steps.packages.outputs.deb_filename}}"
          if-no-files-found: "error"
          retention-days: 14

      - name: "Upload rpm package"
        if: "vars.CI_UPLOAD_PACKAGE_ARTIFACTS != 'false'"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f"  # v6.0.0
        with:
          name: "${{steps.packages.outputs.rpm_filename}}"
          path: "packages/${{steps.packages.outputs.rpm_filename}}"
          if-no-files-found: "error"
          retention-days: 14

      - name: "Upload tarball"
        if: "vars.CI_UPLOAD_PACKAGE_ARTIFACTS != 'false'"
        uses: "actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f"  # v6.0.0
        with:
          name: "${{steps.packages.outputs.tar_gz_filename}}"
          path: "packages/${{steps.packages.outputs.tar_gz_filename}}"
          if-no-files-found: "error"
          retention-days: 14

  # Combine the per-architecture installer images into one multi-arch version tag.
  manifest:
    needs: ["build", "resolve-version"]
    if: "${{needs.resolve-version.outputs.publish == 'true'}}"
    permissions:
      packages: "write"
    runs-on: >-
      ${{ fromJSON(vars.GH_RUNNER_LINUX_LIGHT_X64 || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    env:
      VERSION: "${{needs.resolve-version.outputs.version}}"
      DIGEST_AMD64: "${{needs.build.outputs.digest_amd64}}"
      DIGEST_ARM64: "${{needs.build.outputs.digest_arm64}}"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - name: "Log in to the container registry"
        uses: "docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0"  # v4.4.0
        with:
          registry: "${{vars.CI_CONTAINER_REGISTRY || 'ghcr.io'}}"
          username: "${{secrets.CI_CONTAINER_REGISTRY_USERNAME || github.actor}}"
          password: "${{secrets.CI_CONTAINER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN}}"

      - name: "Create multi-arch manifest"
        run: |-
          # Validate the version with the same shared helper the build script uses, so the
          # manifest tag always matches the per-arch tags (versions with characters Docker
          # tags can't represent, like '+' or '~', fail loudly instead of being mangled).
          source tools/build-packages/dependency-image/utils.sh
          image_repo="$(resolve_image_repo)"
          if ! tag_version="$(package_version_to_image_tag "${VERSION}")"; then
            echo "::error::Version '${VERSION}' can't be used as an image tag"
            exit 1
          fi
          for digest in "${DIGEST_AMD64}" "${DIGEST_ARM64}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or malformed image digest: '${digest}'"
              exit 1
            fi
          done
          # Reference the per-arch images by immutable digest rather than by tag: the
          # per-arch tags are mutable, so a concurrent publish run could move them between
          # the image jobs and this one, silently mixing images from different runs.
          docker buildx imagetools create \
            --tag "${image_repo}:${tag_version}" \
            "${image_repo}@${DIGEST_AMD64}" \
            "${image_repo}@${DIGEST_ARM64}"
