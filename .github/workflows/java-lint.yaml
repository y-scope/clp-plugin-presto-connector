# Checks that presto-connector's Java sources conform to the Spotless formatting rules
# (equivalent to `task lint:check-java`'s Spotless step). Formatting-only: it compiles
# nothing, so it does not need the pinned Presto artifacts.

name: "java-lint"

on:
  pull_request:
    paths:
      - ".github/workflows/java-lint.yaml"
      - "presto-connector/.eclipse-formatter.xml"
      - "presto-connector/pom.xml"
      - "presto-connector/src/**/*.java"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/java-lint.yaml"
      - "presto-connector/.eclipse-formatter.xml"
      - "presto-connector/pom.xml"
      - "presto-connector/src/**/*.java"
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  spotless:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Check Java formatting with Spotless"
        working-directory: "presto-connector"
        run: "./mvnw --batch-mode spotless:check"
