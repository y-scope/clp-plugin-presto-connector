# Java lint checks for presto-connector (equivalent to `task lint:check-java`):
#
# - spotless: formatting only; compiles nothing, so it needs no pinned Presto artifacts.
# - spotbugs: analyzes compiled classes, so it first ensures the pinned Presto commit's
#   unpublished artifacts exist (source-built via install-presto-artifacts.sh; the
#   dependency closure builds in a couple of minutes, so no caching is needed).

name: "java-lint"

on:
  pull_request:
    paths:
      - ".github/workflows/java-lint.yaml"
      - "presto-connector/.eclipse-formatter.xml"
      - "presto-connector/pom.xml"
      - "presto-connector/spotbugs-exclude.xml"
      - "presto-connector/spotbugs-prefs.properties"
      - "presto-connector/src/**/*.java"
      - "taskfile.yaml"
      - "tools/presto-deps/install-presto-artifacts.sh"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/java-lint.yaml"
      - "presto-connector/.eclipse-formatter.xml"
      - "presto-connector/pom.xml"
      - "presto-connector/spotbugs-exclude.xml"
      - "presto-connector/spotbugs-prefs.properties"
      - "presto-connector/src/**/*.java"
      - "taskfile.yaml"
      - "tools/presto-deps/install-presto-artifacts.sh"
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  spotless:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Check Java formatting with Spotless"
        working-directory: "presto-connector"
        run: "./mvnw --batch-mode spotless:check"

  spotbugs:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"  # v7.0.0
        with:
          persist-credentials: false

      - name: "Set up JDK 17"
        uses: "actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95"  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Ensure the pinned Presto commit's Maven artifacts exist"
        run: "./tools/presto-deps/install-presto-artifacts.sh --with-test-deps"

      - name: "Check Java sources with SpotBugs"
        working-directory: "presto-connector"
        run: "./mvnw --batch-mode compile test-compile spotbugs:check"
