coordinator=true
# The CLP connector has no Java data path, so all reads must go to the native worker.
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://coordinator:8080
# Memory limits are left at the image defaults; the stock heap is 1GB.

# Settings a native (C++) cluster requires. Mirrors clp's presto-clp deployment stack.
native-execution-enabled=true
optimizer.optimize-hash-generation=false
regex-library=RE2J
use-alternative-function-signatures=true
inline-sql-functions=false
nested-data-serialization-enabled=false
# The CLP connector provides its own split/handle codecs; without this the coordinator serializes
# them its own way and the native worker cannot deserialize the splits.
use-connector-provided-serialization-codecs=true
