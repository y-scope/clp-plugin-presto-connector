connector.name=clp
clp.metadata-provider-type=INTEGRATION_TEST
clp.split-provider-type=INTEGRATION_TEST
clp.split-filter-provider-type=INTEGRATION_TEST
# Relative, so the split paths handed to the worker are bucket-relative keys rather than local
# paths. Resolved against the coordinator's working directory, which the launcher sets to
# node.data-dir -- hence the fixture mount under that directory in docker-compose.yaml.
clp.integration-test-archive-dir=fixtures
