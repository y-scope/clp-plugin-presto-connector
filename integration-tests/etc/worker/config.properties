# Must match the coordinator's exactly. A mismatched worker still registers and answers health
# checks, but is never counted in `activeWorkers`, so queries queue forever instead of failing.
# Both nodes set this literal, so the match no longer tracks whichever version the images carry.
presto.version=integration-test
discovery.uri=http://coordinator:8080
http-server.http.port=7777
system-memory-gb=2
query-memory-gb=1
shutdown-onset-sec=1
register-test-functions=false
runtime-metrics-collection-enabled=false
# PrestoServer scans this directory for connector shared libraries.
plugin.dir=/opt/presto-server/plugin/clp
