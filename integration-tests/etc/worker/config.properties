# Must match the coordinator's version exactly, which is baked into the coordinator image rather
# than set here. A mismatched worker still registers and answers health checks, but is never
# counted in `activeWorkers`, so queries queue forever instead of failing.
#
# This is NOT derived from `PRESTO_VERSION` in docker-compose.yaml: a bind-mounted properties file
# cannot interpolate environment variables. Overriding that variable means editing this line too.
presto.version=0.299-a814942
discovery.uri=http://coordinator:8080
http-server.http.port=7777
system-memory-gb=2
query-memory-gb=1
shutdown-onset-sec=1
register-test-functions=false
runtime-metrics-collection-enabled=false
# PrestoServer scans this directory for connector shared libraries.
plugin.dir=/opt/presto-server/plugin/clp
