[project]
name = "integration-tests"
version = "0.1.0"
description = "Integration tests for the CLP Presto connector."
readme = "README.md"
authors = [
    { name = "YScope Inc.", email = "dev@yscope.com" }
]
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/clp_presto_integration_tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "presto-python-client>=0.8.4",
    "pytest>=9.0.2",
    "requests>=2.32.0",
]

[tool.uv]
default-groups = ["dev"]
