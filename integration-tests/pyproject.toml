[project]
name = "integration-tests"
version = "0.1.0"
description = "Integration tests for the CLP Presto connector."
readme = "README.md"
authors = [
    { name = "YScope Inc.", email = "dev@yscope.com" }
]
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/clp_presto_integration_tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "presto-python-client>=0.8.4",
    "pytest>=9.0.2",
    "requests>=2.32.0",
    "ruff>=0.11.12",
    "types-requests>=2.32.0",
]

[tool.mypy]
strict = true
pretty = true
show_error_code_links = true
show_error_context = true
show_error_end = true

# presto-python-client ships no stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["prestodb.*"]
ignore_missing_imports = true

[tool.ruff]
extend = "../tools/yscope-dev-utils/exports/lint-configs/python/ruff.toml"

[tool.ruff.lint]
# CPY001: the repository's other Python carries no copyright header; adding them only here would
# be inconsistent.
extend-ignore = ["CPY001"]

[tool.ruff.lint.per-file-ignores]
"src/clp_presto_integration_tests/cluster.py" = [
    "S607",  # `docker` and `bash` are resolved from PATH deliberately
]
"tests/**" = [
    "INP001",  # pytest collects these without an __init__.py
    "PLR2004",  # the expected value is the substance of an assertion, not a magic number
    "S101",  # pytest asserts
    "S608",  # SQL is built from literals and parametrized table names, never external input
    "TC003",  # imports used only for type checking are not worth deferring here
]

[tool.uv]
default-groups = ["dev"]
