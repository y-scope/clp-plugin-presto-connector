[pytest]
addopts =
    --code-highlight=yes
    --color=yes
    --show-capture=no
    --strict-config
    --strict-markers
    --tb=short
    --verbose

console_output_style = classic

markers =
    archive: mark tests that read `.clps` archive splits
    ir: mark tests that read `.clp.zst` IR splits
    pushdown: mark tests that exercise predicate pushdown
    schema: mark tests that exercise table and column discovery
    udf: mark tests that read fields through the CLP_GET_* UDFs
