version: "3"

vars:
  G_LINT_VENV_DIR: "{{.G_BUILD_DIR}}/lint-venv"

tasks:
  check:
    cmds:
      - task: "check-py"
      - task: "check-yaml"

  clean:
    cmd: "rm -rf '{{.G_LINT_VENV_DIR}}'"

  fix:
    cmds:
      - task: "fix-py"
      - task: "fix-yaml"

  check-py:
    cmds:
      - task: "py"
        vars:
          RUFF_CHECK_FLAGS: ""
          RUFF_FORMAT_FLAGS: "--diff"

  fix-py:
    cmds:
      - task: "py"
        vars:
          RUFF_CHECK_FLAGS: "--fix"
          RUFF_FORMAT_FLAGS: ""

  # The only Python in the repository is the integration-tests project, which pins its own
  # toolchain in `uv.lock` and carries the `ruff` and `mypy` configuration that they read. These
  # tasks therefore run through `uv` there, rather than installing linters into the shared venv.
  py:
    internal: true
    vars:
      UV_PYTHON_PROJECTS:
        - "{{.ROOT_DIR}}/integration-tests"
    requires:
      vars: ["RUFF_CHECK_FLAGS", "RUFF_FORMAT_FLAGS"]
    cmds:
      - for:
          var: "UV_PYTHON_PROJECTS"
        cmd: |-
          uv run --directory "{{.ITEM}}" ruff check {{.RUFF_CHECK_FLAGS}} .
          uv run --directory "{{.ITEM}}" ruff format {{.RUFF_FORMAT_FLAGS}} .
          uv run --directory "{{.ITEM}}" mypy .

  yaml:
    aliases:
      - "check-yaml"
      - "fix-yaml"
    deps: ["venv"]
    cmds:
      - |-
        . "{{.G_LINT_VENV_DIR}}/bin/activate"
        yamllint \
          --config-file "tools/yscope-dev-utils/exports/lint-configs/.yamllint.yml" \
          --strict \
          .github/ \
          taskfile.yaml \
          taskfiles/

  venv:
    internal: true
    vars:
      CHECKSUM_FILE: "{{.G_BUILD_DIR}}/{{.TASK | replace \":\" \"#\"}}.md5"
      OUTPUT_DIR: "{{.G_LINT_VENV_DIR}}"
    sources:
      - "{{.ROOT_DIR}}/lint-requirements.txt"
      - "{{.ROOT_TASKFILE}}"
      - "{{.TASKFILE}}"
    generates: ["{{.CHECKSUM_FILE}}"]
    run: "once"
    deps:
      - ":init"
      - task: ":utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - task: ":utils:misc:create-venv"
        vars:
          LABEL: "lint"
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
          REQUIREMENTS_FILE: "{{.ROOT_DIR}}/lint-requirements.txt"

      # This command must be last
      - task: ":utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
