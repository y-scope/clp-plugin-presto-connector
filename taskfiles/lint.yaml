version: "3"

includes:
  toolchains: "toolchains.yaml"

vars:
  G_LINT_VENV_DIR: "{{.G_BUILD_DIR}}/lint-venv"

tasks:
  check:
    cmds:
      - task: "check-helm"
      - task: "check-py"
      - task: "check-yaml"

  clean:
    cmd: "rm -rf '{{.G_LINT_VENV_DIR}}'"

  fix:
    cmds:
      - task: "fix-py"
      - task: "fix-yaml"

  # No `fix-helm`: `ct lint` only reports, so the chart is checked but never "fixed". Keeping a
  # fix alias would make `lint:fix` fail on a chart that `lint:check` already rejected.
  helm:
    aliases:
      - "check-helm"
    deps:
      - "toolchains:helm"
      - "venv"
    cmds:
      - |-
        . "{{.G_LINT_VENV_DIR}}/bin/activate"
        . "{{.G_HELM_TOOLCHAIN_ENV_FILE}}"
        ct lint \
          --chart-dirs="tools/deployment" \
          --chart-repos="presto=https://prestodb.github.io/presto-helm-charts" \
          --chart-yaml-schema="{{.G_HELM_TOOLCHAIN_DIR}}/etc/chart_schema.yaml" \
          --lint-conf="tools/yscope-dev-utils/exports/lint-configs/.yamllint.yml"

  check-py:
    cmds:
      - task: "py"
        vars:
          RUFF_CHECK_FLAGS: ""
          RUFF_FORMAT_FLAGS: "--diff"

  fix-py:
    cmds:
      - task: "py"
        vars:
          RUFF_CHECK_FLAGS: "--fix"
          RUFF_FORMAT_FLAGS: ""

  # The integration-tests project pins its own toolchain in `uv.lock` and carries the `ruff` and
  # `mypy` configuration that these tasks read, so they run through `uv` there rather than
  # installing linters into the shared venv. `tools/deployment` holds standalone scripts, which are
  # checked against the same configuration but not type-checked; `tools/presto-deps` predates that
  # configuration and is not covered yet.
  py:
    internal: true
    vars:
      UV_PYTHON_PROJECTS:
        - "{{.ROOT_DIR}}/integration-tests"
      # Passed explicitly: ruff finds a configuration by walking up from each file, and
      # `tools/` has none of its own.
      UV_PYTHON_CONFIG: "{{.ROOT_DIR}}/integration-tests/pyproject.toml"
    requires:
      vars: ["RUFF_CHECK_FLAGS", "RUFF_FORMAT_FLAGS"]
    cmds:
      - for:
          var: "UV_PYTHON_PROJECTS"
        cmd: |-
          uv run --directory "{{.ITEM}}" ruff check {{.RUFF_CHECK_FLAGS}} .
          uv run --directory "{{.ITEM}}" ruff format {{.RUFF_FORMAT_FLAGS}} .
          uv run --directory "{{.ITEM}}" mypy .
      - |-
        uv run --directory "{{.ROOT_DIR}}/integration-tests" ruff check \
          --config "{{.UV_PYTHON_CONFIG}}" {{.RUFF_CHECK_FLAGS}} ../tools/deployment
      - |-
        uv run --directory "{{.ROOT_DIR}}/integration-tests" ruff format \
          --config "{{.UV_PYTHON_CONFIG}}" {{.RUFF_FORMAT_FLAGS}} ../tools/deployment

  yaml:
    aliases:
      - "check-yaml"
      - "fix-yaml"
    deps: ["venv"]
    cmds:
      - |-
        . "{{.G_LINT_VENV_DIR}}/bin/activate"
        yamllint \
          --config-file "tools/yscope-dev-utils/exports/lint-configs/.yamllint.yml" \
          --strict \
          .github/ \
          taskfile.yaml \
          taskfiles/

  venv:
    internal: true
    vars:
      CHECKSUM_FILE: "{{.G_BUILD_DIR}}/{{.TASK | replace \":\" \"#\"}}.md5"
      OUTPUT_DIR: "{{.G_LINT_VENV_DIR}}"
    sources:
      - "{{.ROOT_DIR}}/lint-requirements.txt"
      - "{{.ROOT_TASKFILE}}"
      - "{{.TASKFILE}}"
    generates: ["{{.CHECKSUM_FILE}}"]
    run: "once"
    deps:
      - ":init"
      - task: ":utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - task: ":utils:misc:create-venv"
        vars:
          LABEL: "lint"
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
          REQUIREMENTS_FILE: "{{.ROOT_DIR}}/lint-requirements.txt"

      # This command must be last
      - task: ":utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
