apiVersion: "v2"
name: "clp-presto"
description: "A Helm chart for Presto with the CLP connector plugin installed"
type: "application"
version: "0.1.0"
appVersion: "0.1.0-dev"
home: "https://github.com/y-scope/clp-plugin-presto-connector"
sources: ["https://github.com/y-scope/clp-plugin-presto-connector"]
maintainers: [{name: "y-scope", email: "dev@yscope.com", url: "https://yscope.com"}]
keywords:
  - "presto"
  - "query-engine"

# Presto itself is deployed by the official chart. This chart owns only what makes it a CLP
# deployment: the connector plugin, the catalog that points at CLP's metadata database, and the
# archive storage the worker reads.
dependencies:
  - name: "presto"
    version: "0.4.0"
    repository: "https://prestodb.github.io/presto-helm-charts"
