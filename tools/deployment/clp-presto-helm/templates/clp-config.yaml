{{- $fsArchives := eq .Values.archiveStorage.type "fs" -}}
{{- if $fsArchives -}}
{{/*
With filesystem archives the worker has to mount them, but the Presto chart takes its volumes as a
literal list that this chart cannot append to. Checking here turns a silent misconfiguration -- a
worker that starts, reports healthy, and fails every read -- into a render-time error.
*/}}
{{- $names := list -}}
{{- range .Values.presto.worker.volumes -}}
{{- $names = append $names .name -}}
{{- end -}}
{{- if not (has .Values.archiveStorage.fs.volumeName $names) -}}
{{- fail (printf "archiveStorage.type is \"fs\", so presto.worker.volumes must include a volume named %q holding the archives, and presto.worker.volumeMounts must mount it. See ci/default-values.yaml." .Values.archiveStorage.fs.volumeName) -}}
{{- end -}}
{{- end -}}
{{/*
The catalog and the native worker's `velox.properties`. The Presto chart renders a catalog from its
own `catalog` value, but that value is a literal string it cannot template, so anything derived from
this chart's structured values has to be rendered here and mounted over it.
*/}}
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: {{ include "clp-presto.configMapName" . | quote }}
  labels:
    {{- include "clp-presto.labels" . | nindent 4 }}
data:
  coordinator-clp.properties: |
    connector.name=clp
    clp.metadata-provider-type=mysql
    clp.metadata-db-url=jdbc:mysql://{{ required "metadataDb.host is required" .Values.metadataDb.host }}:{{ .Values.metadataDb.port | int }}
    clp.metadata-db-name={{ .Values.metadataDb.name }}
    clp.metadata-db-user={{ required "metadataDb.username is required" .Values.metadataDb.username }}
    {{- /* Finding: a Java properties file re-reads backslashes, so escape before writing. */}}
    clp.metadata-db-password={{ required "metadataDb.password is required" .Values.metadataDb.password | replace "\\" "\\\\" }}
    clp.metadata-table-prefix={{ .Values.metadataDb.tablePrefix }}
    clp.split-provider-type=mysql
    clp.split-filter-provider-type=mysql
    clp.split-filter-config=/opt/presto-server/etc/clp-split-filter.json

  worker-clp.properties: |
    connector.name=clp
    {{- if not $fsArchives }}
    {{- with .Values.archiveStorage.s3 }}
    clp.storage-type=s3
    clp.s3-auth-provider=clp_package
    clp.s3-access-key-id={{ .accessKeyId }}
    clp.s3-bucket={{ .bucket }}
    {{- if .endpointUrl }}
    clp.s3-end-point={{ trimSuffix "/" .endpointUrl }}
    {{- else }}
    clp.s3-end-point=https://s3.{{ .regionCode }}.amazonaws.com
    {{- end }}
    clp.s3-secret-access-key={{ .secretAccessKey | replace "\\" "\\\\" }}
    {{- end }}
    {{- end }}

  clp-split-filter.json: |
    {{ .Values.splitFilter | toJson }}

  # The native worker reads this; the Presto chart has no value for it.
  velox.properties: |
    mutable-config=true
