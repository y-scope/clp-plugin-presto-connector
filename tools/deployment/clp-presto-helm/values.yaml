nameOverride: ""

# Rendered with `tpl`, so a parent chart can use a release-derived value such as
# `{{ include "clp.fullname" . }}-presto`.
fullnameOverride: ""

# Rendered with `tpl`. When empty, the namespace's default service account is used.
serviceAccountName: ""

image:
  # The CLP connector plugin. This image is not a workload: its entrypoint copies the plugin into a
  # shared volume that the Presto containers mount, and then exits.
  connector:
    repository: "ghcr.io/y-scope/clp-plugin-presto-connector"
    pullPolicy: "IfNotPresent"
    tag: "0.1.0-SNAPSHOT"
    digest: ""

  # NOTE: The connector is a Presto plugin, so it is ABI-coupled to the Presto version below.
  # Override `coordinator`/`worker` and `connector` together.
  coordinator:
    repository: "prestodb/presto"
    pullPolicy: "IfNotPresent"
    tag: "0.299"
    digest: ""
  worker:
    repository: "prestodb/presto-native"
    pullPolicy: "IfNotPresent"
    tag: "0.299"
    digest: ""

  # The worker's config-setup init container uses this only as a shell, so it needs no access to the
  # Kubernetes API and the pods need no RBAC. An `extraInitContainers` entry that actually calls
  # `kubectl` does, and must be given a service account through `serviceAccountName`.
  kubectl:
    repository: "bitnami/kubectl"
    pullPolicy: "IfNotPresent"
    tag: ""
    digest: "sha256:98736aabcecb8d3cbcdcd7b132d14b1d67ed99bac2f06d471f06235933103df3"  # v1.36.0

coordinator:
  service:
    type: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"

    # The service's nodePort. Ignored unless `type` is "NodePort".
    nodePort: 30889
  loggingLevel: "INFO"
  # Heap for the coordinator's JVM. Keep it below `resources.limits.memory` when that is set: the
  # heap is not the limit's only consumer, so a heap equal to the limit gets the pod OOMKilled.
  heapSize: "4G"
  queryMaxMemoryGb: 1
  queryMaxMemoryPerNodeGb: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Additional environment variables for the coordinator container, rendered with `tpl`.
  extraEnv: []
  # Extra pod annotations, rendered with `tpl`.
  podAnnotations: {}
  # Roll the pod on every `helm upgrade`. Use this when a parent chart supplies the catalog
  # through `catalogs.existingSecret` and therefore cannot contribute a content checksum.
  rollOnUpgrade: false

  # Init containers to run before the plugin is installed, rendered with `tpl`. Use this to wait
  # on dependencies that live outside this chart (e.g. the metadata database).
  extraInitContainers: []
  installPlugin:
    resources: {}

worker:
  replicas: 1
  queryMemoryGb: 4
  systemMemoryGb: 8
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Additional environment variables for the worker container, rendered with `tpl`.
  extraEnv: []
  # Extra pod annotations, rendered with `tpl`.
  podAnnotations: {}
  # Roll the pod on every `helm upgrade` (see `coordinator.rollOnUpgrade`).
  rollOnUpgrade: false

  # Init containers, rendered with `tpl`.
  extraInitContainers: []
  installPlugin:
    resources: {}
  setupConfigs:
    resources: {}

# Catalog properties supplied by a parent chart. The Secret must contain the keys
# "coordinator-catalog-clp.properties" and "worker-catalog-clp.properties". When set, `metadataDb`
# and the S3 credentials under `archiveStorage` are unused.
catalogs:
  existingSecret: ""

# Connection to CLP's metadata database.
# NOTE: When `catalogs.existingSecret` is set, these values are unused; prefer that mode so the
# credentials live in a Secret. Otherwise they are rendered into this chart's ConfigMap, which is
# readable by anything that can read ConfigMaps in the namespace.
metadataDb:
  host: ""
  port: 3306
  name: "clp-db"
  tablePrefix: "clp_"
  username: ""
  password: ""

# Where the worker reads archives from. Must match the CLP deployment's archive output storage.
archiveStorage:
  type: "fs"  # "fs" or "s3"
  fs:
    # An existing PersistentVolumeClaim holding the archives, rendered with `tpl`. Required when
    # `type` is "fs".
    existingClaim: ""
    mountPath: "/var/data/archives"
  s3:
    bucket: ""
    # Also sets AWS_REGION and AWS_DEFAULT_REGION on the worker, which the AWS default credential
    # chain (e.g. IRSA) needs.
    regionCode: ""

    # Overrides the endpoint derived from `regionCode` when set.
    endpointUrl: ""
    accessKeyId: ""
    secretAccessKey: ""

# Metadata columns the coordinator can prune splits on, keyed by scope.
# See "Pruning splits" in presto-connector/README.md.
splitMetadataConfig: {}

probes:
  readiness:
    initialDelaySeconds: 6
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 10
  liveness:
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 4
    failureThreshold: 3
