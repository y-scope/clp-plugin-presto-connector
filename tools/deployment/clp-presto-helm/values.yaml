# Helm cannot compute a subchart's values from a parent's, so anything the Presto chart has to
# interpolate lives under `global`, which every chart in the release can read. The key is named for
# this chart rather than for CLP, because a parent may have globals of its own.
global:
  clpPresto:
    # The image whose entrypoint copies the connector into a shared volume, then exits. It is
    # ABI-coupled to the Presto images below, so the three move together.
    connectorImage: "ghcr.io/y-scope/clp-plugin-presto-connector:0.1.0-SNAPSHOT"

# CLP's metadata database. The connector learns which archives exist from here, so this must be the
# database that CLP compresses into.
metadataDb:
  host: ""
  port: 3306
  name: "clp-db"
  tablePrefix: "clp_"
  username: ""
  password: ""

archiveStorage:
  # "fs" or "s3".
  type: "fs"

  fs:
    # The volume, declared under `presto.worker.volumes`, that holds the archives. The Presto chart
    # takes its volumes as a literal list, so this chart cannot add it; naming it here lets the
    # chart check that it is present rather than let the worker fail on every read.
    volumeName: "clp-archives"
  s3:
    bucket: ""
    regionCode: ""
    endpointUrl: ""
    accessKeyId: ""
    secretAccessKey: ""

# A Service for the coordinator under a name this chart controls. The Presto chart names its own
# Service after the release and offers no override, so callers should use this one.
coordinatorService:
  type: "ClusterIP"
  port: 8889
  nodePort: null

# Split-filter configuration, rendered to JSON. See
# https://docs.yscope.com/presto/connector/clp.html#split-filter-config-file
splitFilter: {}

# Everything below is the official Presto chart's value surface, documented at
# https://github.com/prestodb/presto-helm-charts. Tune Presto itself there rather than here.
presto:
  image:
    repository: "ghcr.io/y-scope/presto"
    tag: "0.299"

  # The CLP connector's data path exists only in the native worker.
  prestoCpp:
    enabled: true
    image:
      repository: "ghcr.io/y-scope/presto-native"
      tag: "0.299"

  # Appended to the coordinator's configuration by the Presto chart. The chart sets the two native
  # flags itself when `prestoCpp.enabled` is on, but not this one: without it the native worker
  # cannot deserialize the connector's split and table-layout handles, and every query fails.
  config: |-
    query.max-memory=1GB
    query.max-memory-per-node=1GB
    use-connector-provided-serialization-codecs=true

  coordinator:
    initContainers:
      - name: "install-clp-plugin"
        image: "{{ .Values.global.clpPresto.connectorImage }}"
        env:
          - name: "COORDINATOR_PLUGIN_INSTALL_PATH"
            value: "/install/coordinator"
        volumeMounts:
          - name: "clp-plugin"
            mountPath: "/install/coordinator"
    volumes:
      - name: "clp-plugin"
        emptyDir: {}
      - name: "clp-config"
        configMap:
          name: "{{ .Release.Name }}-clp-config"
    volumeMounts:
      - name: "clp-plugin"
        mountPath: "/opt/presto-server/plugin/clp"
        readOnly: true
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/catalog/clp.properties"
        subPath: "coordinator-clp.properties"
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/clp-split-filter.json"
        subPath: "clp-split-filter.json"

  worker:
    # NOTE: This replaces the chart's common `config` rather than merging with it, so every key the
    # native worker needs has to appear here.
    config: |-
      coordinator=false
      http-server.http.port=8080
      discovery.uri=http://{{ .Release.Name }}-discovery:8080
      system-memory-gb=8
      query-memory-gb=4
      shutdown-onset-sec=1
      register-test-functions=false
      runtime-metrics-collection-enabled=false
      plugin.dir=/opt/presto-server/plugin/clp
    initContainers:
      - name: "install-clp-plugin"
        image: "{{ .Values.global.clpPresto.connectorImage }}"
        env:
          - name: "WORKER_PLUGIN_INSTALL_PATH"
            value: "/install/worker"
        volumeMounts:
          - name: "clp-plugin"
            mountPath: "/install/worker"
    volumes:
      - name: "clp-plugin"
        emptyDir: {}
      - name: "clp-config"
        configMap:
          name: "{{ .Release.Name }}-clp-config"
    volumeMounts:
      - name: "clp-plugin"
        mountPath: "/opt/presto-server/plugin/clp"
        readOnly: true
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/catalog/clp.properties"
        subPath: "worker-clp.properties"
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/velox.properties"
        subPath: "velox.properties"
