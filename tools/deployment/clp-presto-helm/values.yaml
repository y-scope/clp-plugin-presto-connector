nameOverride: ""
fullnameOverride: ""

# Service account for the coordinator and worker pods. When empty, the namespace's default service
# account is used.
serviceAccountName: ""

image:
  # The CLP connector plugin. This image is not a workload: its entrypoint copies the plugin into a
  # shared volume that the Presto containers mount, and then exits.
  connector:
    repository: "ghcr.io/y-scope/clp-plugin-presto-connector"
    pullPolicy: "IfNotPresent"
    tag: "0.1.0-SNAPSHOT"
    digest: ""

  # NOTE: The connector is a Presto plugin, so it is ABI-coupled to the Presto version below.
  # Override `coordinator`/`worker` and `connector` together.
  coordinator:
    repository: "ghcr.io/y-scope/presto"
    pullPolicy: "IfNotPresent"
    tag: "0.299"
    digest: ""
  worker:
    repository: "ghcr.io/y-scope/presto-native"
    pullPolicy: "IfNotPresent"
    tag: "0.299"
    digest: ""

  # The worker's config-setup init container uses this only as a shell, so it needs no access to the
  # Kubernetes API and the pods need no RBAC. An `extraInitContainers` entry that actually calls
  # `kubectl` does, and must be given a service account through `serviceAccountName`.
  kubectl:
    repository: "bitnami/kubectl"
    pullPolicy: "IfNotPresent"
    tag: ""
    digest: "sha256:98736aabcecb8d3cbcdcd7b132d14b1d67ed99bac2f06d471f06235933103df3"  # v1.36.0

coordinator:
  service:
    type: "ClusterIP"  # "NodePort", "ClusterIP", or "LoadBalancer"

    # The service's nodePort. Ignored unless `type` is "NodePort".
    nodePort: 30889
  loggingLevel: "INFO"
  queryMaxMemoryGb: 1
  queryMaxMemoryPerNodeGb: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Init containers to run before the plugin is installed. Use this to wait on dependencies that
  # live outside this chart (e.g. the metadata database).
  extraInitContainers: []
  installPlugin:
    resources: {}

worker:
  replicas: 1
  queryMemoryGb: 4
  systemMemoryGb: 8
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraInitContainers: []
  installPlugin:
    resources: {}
  setupConfigs:
    resources: {}

# Connection to CLP's metadata database.
metadataDb:
  # NOTE: These credentials are rendered into the connector's catalog properties file, which is
  # currently stored in a ConfigMap and so is readable by anything that can read ConfigMaps in the
  # namespace. Presto only reads the file off disk, so the catalog volume could project a Secret
  # instead; that is worth doing before this chart is used with real credentials.
  host: ""
  port: 3306
  name: "clp-db"
  tablePrefix: "clp_"
  username: ""
  password: ""

# Where the worker reads archives from. Must match the CLP deployment's archive output storage.
archiveStorage:
  type: "fs"  # "fs" or "s3"
  fs:
    # An existing PersistentVolumeClaim holding the archives. Required when `type` is "fs".
    existingClaim: ""
    mountPath: "/var/data/archives"
  s3:
    bucket: ""
    regionCode: ""

    # Overrides the endpoint derived from `regionCode` when set.
    endpointUrl: ""
    accessKeyId: ""
    secretAccessKey: ""

# Split filter config for the CLP connector.
# See https://docs.yscope.com/presto/connector/clp.html#split-filter-config-file
splitFilter: {}

probes:
  readiness:
    initialDelaySeconds: 6
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 10
  liveness:
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 4
    failureThreshold: 3
