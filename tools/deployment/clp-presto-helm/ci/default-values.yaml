# Values used by `ct lint` to render the chart with filesystem-backed archives.
global:
  clp:
    archiveClaim: "clp-archives"

metadataDb:
  host: "clp-database"
  username: "clp-user"
  password: "clp-password"

presto:
  worker:
    volumes:
      - name: "clp-plugin"
        emptyDir: {}
      - name: "clp-config"
        configMap:
          name: "{{ .Release.Name }}-clp-config"
      - name: "clp-archives"
        persistentVolumeClaim:
          claimName: "{{ .Values.global.clp.archiveClaim }}"
    volumeMounts:
      - name: "clp-plugin"
        mountPath: "/opt/presto-server/plugin/clp"
        readOnly: true
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/catalog/clp.properties"
        subPath: "worker-clp.properties"
      - name: "clp-config"
        mountPath: "/opt/presto-server/etc/velox.properties"
        subPath: "velox.properties"
      - name: "clp-archives"
        mountPath: "/var/data/archives"
        readOnly: true
