# SpotBugs user preferences, used to enable detectors that SpotBugs disables by default. Each entry
# has the form `detector<ShortName>=<ShortName>|<enabled>`.
#
# NOTE: SpotBugs applies this file after the command-line options, so any setting it omits falls back
# to the SpotBugs default rather than the value configured in pom.xml. `effort` is therefore repeated
# here to keep the pom's `<effort>Max</effort>` in force.
effort=max

# Applet constructors that call methods relying on the not-yet-initialized AppletStub. Cannot fire on
# this project (the Applet API was removed in JDK 21), but costs nothing and guards against
# regressions if applet-era code is ever vendored in.
detectorBadAppletConstructor=BadAppletConstructor|true

# Calls to methods that unconditionally throw UnsupportedOperationException, e.g. mutating a Guava
# immutable collection or the list returned by Arrays.asList().
detectorCallToUnsupportedMethod=CallToUnsupportedMethod|true

# Covariant array assignments such as `Object[] a = new String[10]`, which risk ArrayStoreException.
detectorCovariantArrayAssignment=CovariantArrayAssignment|true

# Expensive initialization inside loops: Pattern.compile, Connection.prepareStatement, and
# NodeList.getLength.
detectorInefficientInitializationInsideLoop=InefficientInitializationInsideLoop|true

# Public classes that synchronize or call wait/notify/notifyAll on `this`, letting callers deadlock
# the class by locking on its instances.
detectorPublicSemaphores=PublicSemaphores|true

# Circular dependencies between classes.
detectorFindCircularDependencies=FindCircularDependencies|true

# Class, method, field, and local names that collide with public identifiers in the Java Standard
# Library.
detectorDontReusePublicIdentifiers=DontReusePublicIdentifiers|true

# Overrides that only forward their arguments to the superclass method, and abstract methods already
# declared by an implemented interface.
detectorUselessSubclassMethod=UselessSubclassMethod|true
